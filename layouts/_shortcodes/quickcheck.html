{{ $title := .Get "title" | default "Quick Check" }}
{{ $q := .Get "question" }}
<div class="quickcheck-card" style="border: 1px solid rgba(128, 128, 128, 0.25); border-left: 4px solid #6366f1; border-radius: 0.5rem; padding: 1.1rem 1.25rem; margin: 1.5rem 0; background: rgba(99, 102, 241, 0.04);">
  <div style="font-weight: 700; font-size: 0.95rem; text-transform: uppercase; letter-spacing: 0.04em; color: #818cf8; margin-bottom: 0.5rem; display: flex; align-items: center; gap: 0.4rem;">
    <span>⚡</span> {{ $title }}
  </div>
  {{ with $q }}
  <p style="font-weight: 600; font-size: 1.05rem; margin: 0.4rem 0 0.8rem; line-height: 1.5;">{{ . }}</p>
  {{ end }}
  <div class="quickcheck-content" style="font-size: 0.95rem; line-height: 1.6;">
    {{ .Inner | markdownify }}
  </div>
</div>
