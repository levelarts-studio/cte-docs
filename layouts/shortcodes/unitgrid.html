<div class="unit-grid">
  {{ .Inner }}
</div>
{{- $key := "unitgrid-css-included" -}}
{{- if not (.Page.Scratch.Get $key) -}}
  <style>
    .unit-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 1rem;
      margin: 1rem 0 2rem 0;
    }
    .unit-card {
      box-shadow: 0 1px 3px rgba(0,0,0,.08);
      border: 1px solid var(--card-border, #e6e6e6);
      border-radius: 12px;
      background: var(--card-bg, #fff);
      padding: 16px;
      transition: transform .12s ease, box-shadow .12s ease;
    }
    .unit-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 18px rgba(0,0,0,.12);
    }
    .unit-badge {
      display: inline-block;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .04em;
      color: var(--badge-fg, #2c3e50);
      background: var(--badge-bg, #eef3ff);
      border: 1px solid var(--badge-border, #d6e2ff);
      border-radius: 999px;
      padding: 4px 10px;
      margin-bottom: 8px;
    }
    .unit-title {
      font-size: 18px;
      line-height: 1.3;
      margin: 4px 0 8px 0;
    }
    .unit-desc {
      font-size: 14px;
      color: var(--text-muted, #57606a);
      margin: 0 0 12px 0;
    }
    .unit-cta {
      display: inline-flex;
      align-items: center;
      gap: .35rem;
      font-size: 14px;
      color: var(--link, #0b5fff);
      text-decoration: none;
    }
    .unit-cta:hover { text-decoration: underline; }
  </style>
  {{- .Page.Scratch.Set $key true -}}
{{- end -}}
