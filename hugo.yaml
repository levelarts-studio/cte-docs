title: "Game Art, Design & Media Learning Library"
baseURL: "https://cte.levelarts.studio/"
languageCode: en-us
theme: hextra

enableGitInfo: true

taxonomies:
  standard: standards
  tool: tools

markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    noClasses: false

menu:
  main:
    - name: Start Here
      url: /start/
      weight: 1

    - name: Module Library
      url: /learn/
      weight: 2

    - name: Course Maps
      url: /courses/
      weight: 3

    - name: Assignments
      url: /assignments/
      weight: 4

    - name: Standards
      url: /standards/
      weight: 5

    - name: FAQ & Help
      url: /faq/
      weight: 6

    - name: Google Classroom
      url: "https://classroom.google.com/"
      weight: 7

    - name: Search
      weight: 8
      params:
        type: search

params:
  description: "California CTE Model Curriculum Standards-aligned textbook modules, hands-on lab specs, and 3D creation pathways for high school & CTE students."
  navbar:
    displayTitle: true
    displayLogo: false
  sidebar:
    collapsed: true
  author:
    email: jay@levelarts.studio
    name: Jay Tilghman
  footer:
    displayCopyright: false
    displayPoweredBy: false

cascade:
  - type: docs
    target:
      path: '{/learn/**,/assignments/**,/courses/**,/start/**,/faq/**,/status/**}'
