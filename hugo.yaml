# Hugo configuration file
title: AME | Intro to Media Careers + Game Art & Design
baseURL: "/"
languageCode: en-us

module:
  imports:
    - path: github.com/imfing/hextra

markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    noClasses: false

# Optional content organization
taxonomies:
  unit: units
  lesson: lessons
  tag: tags

menu:
  main:
    - name: Courses
      pageRef: /courses
      weight: 1

    - name: Intro to Media Careers
      pageRef: /courses/intro-media-careers
      parent: Courses
      weight: 2

    - name: Game Art & Design 1
      pageRef: /courses/game-art-design-1
      parent: Courses
      weight: 3

    - name: Game Art & Design 2
      pageRef: /courses/game-art-design-2
      parent: Courses
      weight: 4

    - name: Docs
      pageRef: /docs
      weight: 5

    - name: About
      pageRef: /about
      weight: 6

    - name: Contact ↗
      url: "mailto:jaytilghman@aldergrovecharter.org"
      weight: 7

    - name: Search
      weight: 8
      params:
        type: search

params:
  navbar:
    displayTitle: true
    displayLogo: false

  footer:
    displayCopyright: false
    displayPoweredBy: true

  editURL:
    enable: true
    base: "https://github.com/CHANGE_ME/ame-site/edit/main/content"
