<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4c0519" />
      <stop offset="100%" stop-color="#881337" />
    </linearGradient>
    <radialGradient id="glow" cx="80%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1" />
    </pattern>
  </defs>

  <rect width="800" height="450" fill="url(#bg)" />
  <rect width="800" height="450" fill="url(#grid)" />
  <rect width="800" height="450" fill="url(#glow)" />

  <!-- Accent Circle -->
  <circle cx="700" cy="100" r="180" fill="#ffffff" fill-opacity="0.03" />

  <g transform="translate(60, 220)">
    <text font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="44" fill="#ffffff" letter-spacing="-1">Media & Storytelling</text>
    <text y="45" font-family="system-ui, -apple-system, sans-serif" font-weight="500" font-size="22" fill="#ffffff" fill-opacity="0.75">Narrative, Shots & Editing</text>
  </g>
  
  <rect x="60" y="320" width="80" height="4" rx="2" fill="#ffffff" fill-opacity="0.4" />
</svg>